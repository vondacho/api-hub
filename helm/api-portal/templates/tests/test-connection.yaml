apiVersion: v1
kind: Pod
metadata:
  name: {{ include "api-portal.fullname" . }}-test-connection
  labels:
    {{- include "api-portal.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: health
      image: curlimages/curl:8.11.1
      args:
        - --fail
        - --silent
        - --show-error
        - http://{{ include "api-portal.fullname" . }}:{{ .Values.service.port }}{{ .Values.probes.path }}
