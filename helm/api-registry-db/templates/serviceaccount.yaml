{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "api-registry-db.serviceAccountName" . }}
  labels:
    {{- include "api-registry-db.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The database does not talk to the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
