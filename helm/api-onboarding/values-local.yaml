# Overrides for a locally built image on a single-node cluster
# (Rancher Desktop / Docker Desktop).
#
#   helm upgrade --install api-onboarding helm/api-onboarding \
#     -n api-hub --create-namespace \
#     -f helm/api-onboarding/values-local.yaml

image:
  repository: api-onboarding
  tag: dev
  # The image is built straight into the node's image store, never pulled.
  pullPolicy: Never

# Both outbound adapters point at the real deployed services, so the whole
# registration path is exercised locally.
#
# `strapi` only works once the "specification" permissions (find, findOne,
# create, update) are granted to Strapi's Public role in the admin UI —
# adapter/out/strapi sends no API token, so an ungranted role answers 403 and
# every registration fails at the persistence step. See helm/README.md.
app:
  registry:
    adapter: strapi
  scorer:
    adapter: spectral
  extraConfig:
    logging:
      level:
        io.obya.api.onboarding: DEBUG

# Rancher Desktop runs Traefik as the default IngressClass. This is a local
# convenience only: api-portal is server-rendered precisely so the browser never
# has to reach onboarding, so nothing in the product needs this route. It saves a
# port-forward when poking at the API by hand — do not carry it into a real
# cluster, where onboarding should stay ClusterIP.
ingress:
  enabled: true
  className: traefik
  hosts:
    - host: api-onboarding.localhost
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 768Mi
