# Overrides for a locally built image on a single-node cluster
# (Rancher Desktop / Docker Desktop).
#
#   helm upgrade --install api-onboarding helm/api-onboarding \
#     -n api-hub --create-namespace \
#     -f helm/api-onboarding/values-local.yaml

image:
  repository: api-onboarding
  tag: dev
  # The image is built straight into the node's image store, never pulled.
  pullPolicy: Never

# The scorer is deployed by helm/api-scorer, so point at it for real — that
# path is the one worth exercising locally.
#
# The registry stays on the in-memory dummy: api-registry is deployed, but
# adapter/out/strapi sends no API token, so switching it also means granting the
# "specification" permissions to Strapi's Public role in the admin UI. See
# helm/README.md.
app:
  registry:
    adapter: dummy
  scorer:
    adapter: spectral
  extraConfig:
    logging:
      level:
        io.obya.api.onboarding: DEBUG

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 768Mi
