apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "api-onboarding.fullname" . }}
  labels:
    {{- include "api-onboarding.labels" . | nindent 4 }}
data:
  # Mounted at /app/config/application.yaml. Spring Boot loads the ./config/
  # directory ahead of the classpath, so these values win over the defaults
  # baked into the jar while everything unset there still applies.
  application.yaml: |-
    registry:
      adapter: {{ .Values.app.registry.adapter | quote }}

    scorer:
      adapter: {{ .Values.app.scorer.adapter | quote }}

    strapi:
      base-url: {{ .Values.app.strapi.baseUrl | quote }}

    spectral:
      base-url: {{ .Values.app.spectral.baseUrl | quote }}

    jentic:
      base-url: {{ .Values.app.jentic.baseUrl | quote }}
    {{- with .Values.app.extraConfig }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
