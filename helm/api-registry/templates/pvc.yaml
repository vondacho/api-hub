{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "api-registry.fullname" . }}-uploads
  labels:
    {{- include "api-registry.labels" . | nindent 4 }}
  annotations:
    # Uploaded media is referenced by rows in api-registry-db. Dropping the
    # volume on uninstall would leave the database pointing at files that no
    # longer exist, so the claim outlives the release.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
{{- end }}
