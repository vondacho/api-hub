{{- if not .Values.strapi.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "api-registry.fullname" . }}
  labels:
    {{- include "api-registry.labels" . | nindent 4 }}
  annotations:
    # Kept on uninstall. These secrets are bound to data sitting in
    # api-registry-db: losing ENCRYPTION_KEY makes already-stored encrypted
    # fields permanently unreadable, so the Secret must not be easier to
    # destroy than the database it decrypts.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # config/server.ts reads this as a comma-separated array.
  APP_KEYS: {{ include "api-registry.appKeys" . | quote }}
  API_TOKEN_SALT: {{ include "api-registry.secret" (dict "ctx" $ "key" "API_TOKEN_SALT" "value" .Values.strapi.apiTokenSalt "gen" 32) | quote }}
  ADMIN_JWT_SECRET: {{ include "api-registry.secret" (dict "ctx" $ "key" "ADMIN_JWT_SECRET" "value" .Values.strapi.adminJwtSecret "gen" 32) | quote }}
  TRANSFER_TOKEN_SALT: {{ include "api-registry.secret" (dict "ctx" $ "key" "TRANSFER_TOKEN_SALT" "value" .Values.strapi.transferTokenSalt "gen" 32) | quote }}
  JWT_SECRET: {{ include "api-registry.secret" (dict "ctx" $ "key" "JWT_SECRET" "value" .Values.strapi.jwtSecret "gen" 32) | quote }}
  ENCRYPTION_KEY: {{ include "api-registry.secret" (dict "ctx" $ "key" "ENCRYPTION_KEY" "value" .Values.strapi.encryptionKey "gen" 32) | quote }}
{{- end }}
