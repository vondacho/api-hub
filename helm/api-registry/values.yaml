# Default values for api-registry.
# Tuned for a local single-node cluster (Rancher Desktop / Docker Desktop).

replicaCount: 1

image:
  repository: api-registry
  # Defaults to .Chart.AppVersion when empty.
  tag: ""
  # IfNotPresent so a locally built image is used without a registry push.
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  # Defaults to the fullname template when empty.
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  # Must match the "app" user baked into api-registry/Dockerfile.
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  # Strapi writes only to public/uploads and /tmp at run time; both are mounted
  # as volumes, so the image itself can stay read-only.
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 1337

# The admin UI is a browser application, so unlike api-onboarding this chart
# expects an ingress in any environment where a human uses it.
ingress:
  enabled: false
  # Empty uses the cluster's default IngressClass. Rancher Desktop ships
  # "traefik" as the default.
  className: ""
  annotations: {}
  hosts:
    - host: api-registry.localhost
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    # No CPU limit: Strapi is bursty while it boots and migrates the schema.
    # 1Gi because the admin panel is served from a Node process that holds the
    # whole bundle in memory.
    memory: 1Gi

# Strapi answers /_health with 204 once the HTTP server is up.
probes:
  path: /_health
  startup:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 5
    # Generous: the first boot runs the full schema migration against an empty
    # database before the server starts listening.
    failureThreshold: 60
  liveness:
    enabled: true
    periodSeconds: 15
    failureThreshold: 3
  readiness:
    enabled: true
    periodSeconds: 10
    failureThreshold: 3

# ---------------------------------------------------------------------------
# Database.
#
# Points at the api-registry-db release. The password is never duplicated here:
# it is read from the Secret that chart owns, through a secretKeyRef.
# ---------------------------------------------------------------------------
database:
  client: postgres
  host: api-registry-db
  port: 5432
  name: strapi
  username: strapi
  # Secret holding the password, owned by the api-registry-db release.
  existingSecret: api-registry-db
  passwordKey: POSTGRES_PASSWORD
  ssl: false
  pool:
    min: 2
    max: 10
  # Strapi migrates its own schema on boot; this is how long it waits for the
  # database to accept a connection before giving up.
  connectionTimeout: 60000

# ---------------------------------------------------------------------------
# Strapi application secrets.
#
# Generated on first install and preserved across upgrades by reading them back
# from the live Secret. That is not cosmetic: rotating ENCRYPTION_KEY makes
# already-stored encrypted fields unreadable, and rotating APP_KEYS or
# ADMIN_JWT_SECRET signs every existing admin out.
#
# Set any of these to pin it, or point existingSecret at a Secret you manage.
# ---------------------------------------------------------------------------
strapi:
  existingSecret: ""
  appKeys: ""
  apiTokenSalt: ""
  adminJwtSecret: ""
  transferTokenSalt: ""
  jwtSecret: ""
  encryptionKey: ""

# ---------------------------------------------------------------------------
# Application configuration, rendered into a ConfigMap and injected via envFrom.
# ---------------------------------------------------------------------------
app:
  # Public origin as the browser sees it. Behind an ingress this differs from
  # the in-cluster address, and Strapi needs it to build the absolute URLs it
  # hands to the admin panel. Left empty the UI calls back to host:port, which
  # does not resolve from a browser.
  #
  # Defaults to the first ingress host when ingress.enabled and this is empty.
  url: ""

  # Strapi phones home on boot unless this is set.
  telemetryDisabled: true

  # Arbitrary extra entries, merged verbatim into the same ConfigMap and so
  # injected as env vars too:
  #   extraConfig:
  #     LOG_LEVEL: debug
  extraConfig: {}

# Uploads are written to disk by the default upload provider, so they need a
# volume to survive a restart. Disable only if a remote provider is configured.
persistence:
  enabled: true
  # Empty uses the cluster's default StorageClass.
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi

# Flags passed to the Node process, e.g. "--max-old-space-size=768".
nodeOptions: ""

# Additional raw environment variables (full valueFrom syntax available), e.g.
#   - name: SOME_SECRET
#     valueFrom:
#       secretKeyRef: { name: registry, key: token }
extraEnv: []

nodeSelector: {}
tolerations: []
affinity: {}
