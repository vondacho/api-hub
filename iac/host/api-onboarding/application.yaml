# Mounted read-only at /app/config/application.yaml.
#
# Spring Boot loads the ./config/ directory ahead of the classpath, so these
# values win over the defaults baked into the jar while everything unset here
# still applies. This is the compose counterpart of the ConfigMap in
# helm/api-onboarding/templates/configmap.yaml — same keys, same meaning; only
# the hosts differ, because on the compose network a service name resolves to a
# container rather than to a Kubernetes Service.
#
# The chart defaults both adapters to "dummy" so a bare `helm install` comes up
# without the rest of the system. Production runs the real ones.

registry:
  adapter: "strapi"

scorer:
  adapter: "spectral"

# The registry's REST API. The generated Strapi client appends its own paths, so
# this must end at /api.
strapi:
  base-url: "http://api-registry:1337/api"

# The generated ScoringApi appends "/scorings", so this must end at the scoring
# contract's servers[0].url — /api/v1. Note the port: the chart maps Service
# port 8081 onto the container's 3000, and there is no such indirection here, so
# this addresses 3000 where the chart addresses 8081.
spectral:
  base-url: "http://api-scorer:3000/api/v1"

# No Jentic service exists yet; kept so switching scorer.adapter to "jentic"
# fails on a connection rather than on a missing property.
jentic:
  base-url: "http://api-scorer:3000/api/v1"
