<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="presentation">
  <!--
    Hero backdrop: a contract graph. Nodes are services, edges are the contracts
    between them, and the brighter nodes are the ones that have been onboarded.
    Drawn rather than photographed so it stays sharp at any width, themes with
    the page, and costs a few KB.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1b33" />
      <stop offset="55%" stop-color="#12305a" />
      <stop offset="100%" stop-color="#1c2f52" />
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.25" r="0.75">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="0.15" cy="0.85" r="0.6">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)" />
  <rect width="1600" height="900" fill="url(#grid)" />
  <rect width="1600" height="900" fill="url(#glow)" />
  <rect width="1600" height="900" fill="url(#glow2)" />

  <g stroke="#7dd3fc" stroke-opacity="0.28" stroke-width="1.5" fill="none">
    <path d="M180 640 L420 470 L700 560 L980 380 L1240 470 L1420 300" />
    <path d="M180 640 L360 780 L700 560" />
    <path d="M420 470 L520 250 L780 180 L980 380" />
    <path d="M700 560 L900 700 L1180 690 L1240 470" />
    <path d="M980 380 L1080 200 L1420 300" />
    <path d="M360 780 L900 700" />
    <path d="M520 250 L420 470" />
    <path d="M1180 690 L1420 300" />
  </g>

  <g fill="#e0f2fe">
    <circle cx="180" cy="640" r="5" fill-opacity="0.55" />
    <circle cx="420" cy="470" r="8" fill-opacity="0.9" />
    <circle cx="700" cy="560" r="10" fill-opacity="1" />
    <circle cx="980" cy="380" r="8" fill-opacity="0.9" />
    <circle cx="1240" cy="470" r="6" fill-opacity="0.65" />
    <circle cx="1420" cy="300" r="5" fill-opacity="0.5" />
    <circle cx="520" cy="250" r="5" fill-opacity="0.5" />
    <circle cx="780" cy="180" r="4" fill-opacity="0.4" />
    <circle cx="1080" cy="200" r="4" fill-opacity="0.4" />
    <circle cx="360" cy="780" r="6" fill-opacity="0.6" />
    <circle cx="900" cy="700" r="7" fill-opacity="0.75" />
    <circle cx="1180" cy="690" r="5" fill-opacity="0.5" />
  </g>

  <g fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5">
    <circle cx="700" cy="560" r="22" />
    <circle cx="420" cy="470" r="18" />
    <circle cx="980" cy="380" r="18" />
  </g>
</svg>
