asyncapi: 3.0.0
info:
  title: Unnamed Notification API
  description: A valid AsyncAPI document carrying no onboarding metadata extension at all.
  version: v1
channels:
  notifications:
    address: platform/notifications
    messages:
      notificationSent:
        $ref: '#/components/messages/NotificationSent'
operations:
  sendNotification:
    action: send
    channel:
      $ref: '#/channels/notifications'
    messages:
      - $ref: '#/channels/notifications/messages/notificationSent'
components:
  messages:
    NotificationSent:
      payload:
        type: object
        properties:
          id:
            type: string
          message:
            type: string
