overlay: 1.0.0
info:
  title: Overlay for injecting examples into the Registry API specfiication
  version: v1
extends: '/specification_v1.openapi.json'
actions:
  - target: '$' # Root of document
    update:
      paths:
        /specifications:
          get:
            parameters:
              - name: filters
                in: query
                schema:
                  type: object
                examples:
                  latest-at-petstore-platform:
                    value:
                      name: petstore
                      productName: platform
                      version: v1
                  at-petstore-platform-1-0-0:
                    value:
                      name: petstore
                      productName: platform
                      version: v1
                      revision: 1.0.0
                  at-petstore-platform-1-0-1:
                    value:
                      name: petstore
                      productName: platform
                      version: v1
                      revision: 1.0.1
            responses:
              "200":
                content:
                  application/json:
                    examples:
                      latest-at-petstore-platform:
                        $ref: '#/components/examples/out-all-specifications-456'
                      at-petstore-platform-1-0-0:
                        $ref: '#/components/examples/out-all-specifications-123'
                      at-petstore-platform-1-0-1:
                        $ref: '#/components/examples/out-all-specifications-456'
                      all:
                        $ref: '#/components/examples/out-all-specifications'
          post:
            requestBody:
              content:
                application/json:
                  examples:
                    valid-candidate:
                      $ref: '#/components/examples/in-valid-candidate'
            responses:
              "201":
                content:
                  application/json:
                    examples:
                      valid-candidate:
                        $ref: '#/components/examples/out-specification-123'

        /specifications/{id}:
          get:
            parameters:
              - name: id
                in: path
                schema:
                  type: string
                examples:
                  at-123:
                    value: '123'
                  at-456:
                    value: '456'
                  unexistent:
                    value: not-found
            responses:
              "200":
                content:
                  application/json:
                    examples:
                      at-123:
                        $ref: '#/components/examples/out-specification-123'
                      at-456:
                        $ref: '#/components/examples/out-specification-456'
          put:
            parameters:
              - name: id
                in: path
                schema:
                  type: string
                examples:
                  at-123:
                    value: '123'
                  at-456:
                    value: '456'
            requestBody:
              content:
                application/json:
                  examples:
                    at-123:
                      $ref: '#/components/examples/in-valid-candidate'
            responses:
              "200":
                content:
                  application/json:
                    examples:
                      at-123:
                        $ref: '#/components/examples/out-specification-123'
                      at-456:
                        $ref: '#/components/examples/out-specification-456'
          delete:
            parameters:
              - name: id
                in: path
                schema:
                  type: string
                examples:
                  at-123:
                    value: '123'
                  at-456:
                    value: '456'
            responses:
              "200":
                content:
                  application/json:
                    examples:
                      at-123:
                        $ref: '#/components/examples/out-specification-123'
                      at-456:
                        $ref: '#/components/examples/out-specification-456'

      components:
        examples:
          in-valid-candidate:
            description: A valid candidate to be registered
            value:
              data:
                specId: petstore-platform-1.0.0
