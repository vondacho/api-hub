apiVersion: mocks.microcks.io/v1alpha1
kind: APIExamples
metadata:
  name: API Onboarding - Registration
  version: v1
operations:
  PUT /registrations/{id}/score:
    scorecard:
      request:
        headers:
          Accept: application/json
        parameters:
          id: 123
      response:
        status: 200
        mediaType: application/json
        body: "{\"score\":74,\"grade\":\"A-\",\"dimensions\":[{\"name\":\"FC\",\"\
          intent\":\"Base layer of spec validity and structural soundness\",\"score\"\
          :99,\"grade\":\"A+\"},{\"name\":\"SEC\",\"intent\":\"Trust, risk posture,\
          \ and security compliance.\",\"score\":100,\"grade\":\"A+\"},{\"name\":\"\
          DX\",\"intent\":\"Clarity, completeness, and ingestion readiness for developers\
          \ and tooling\",\"score\":66,\"grade\":\"B\"},{\"name\":\"ARAX\",\"intent\"\
          :\"Semantic breadth, depth, and agent comprehension for AI systems.\",\"\
          score\":51,\"grade\":\"C-\"},{\"name\":\"AU\",\"intent\":\"Functional utility,\
          \ complexity comfort, and AI orchestration readiness.\",\"score\":93,\"\
          grade\":\"A+\"},{\"name\":\"AID\",\"intent\":\"Findability, semantic richness,\
          \ and reasoning readiness.\",\"score\":100,\"grade\":\"A+\"}]}"
    invalid-specification-not-found:
      request:
        headers:
          Accept: application/problem+json
        parameters:
          id: not-found
      response:
        status: 422
        mediaType: application/problem+json
        body: "{\"type\":\"https://problems-registry.smartbear.com/validation-error\"\
          ,\"status\":422,\"title\":\"Validation Error\",\"detail\":\"The request\
          \ is invalid.\"}"
